# 반도체 밸류체인 프리셋 — 그룹 이름을 CLI의 --group 으로 넘긴다.
# 기업명은 DART 정식 명칭 기준. 못 찾으면 종목코드(6자리)로 바꿔 적으면 확실하다.

groups:
  소자:            # IDM / 메모리
    - 삼성전자
    - SK하이닉스
    - DB하이텍

  장비:            # 전공정 장비
    - 세메스          # 비상장(삼성 계열) — 조회 안 되면 자동 스킵
    - 원익IPS
    - 주성엔지니어링
    - 유진테크
    - 테스
    - 피에스케이

  cmp:             # CMP·세정 등 습식 공정 연관
    - 케이씨텍
    - 씨티에스
    - 에스티아이

  소재:            # 화학 소재 — 화공 전공 관점의 핵심 축
    - 동진쎄미켐      # 포토레지스트
    - 솔브레인        # 식각액·CMP 슬러리
    - 한솔케미칼      # 과산화수소·프리커서
    - 이엔에프테크놀로지
    - 원익머트리얼즈
    - SK머티리얼즈    # 상장폐지 이력 있음 — 조회 실패 시 스킵

  포토:            # 포토리소그래피 밸류체인
    - 동진쎄미켐
    - 이엔에프테크놀로지
    - 에스앤에스텍     # 블랭크마스크
    - 피에스케이

  후공정:
    - 하나마이크론
    - 에스에프에이반도체
    - 네패스

# 사업보고서 diff에서 우선적으로 볼 섹션
diff_sections:
  - 사업의 개요
  - 주요 제품 및 서비스
  - 원재료 및 생산설비
  - 매출 및 수주상황
  - 주요계약 및 연구개발활동
  - 기타 참고사항

# 추이 그래프/표로 뽑을 지표
trend_metrics:
  - 매출액(억원)
  - 영업이익률(%)
  - 재고회전일수(일)
  - CAPEX/매출(%)
  - 1인당매출(백만원)
